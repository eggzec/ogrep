name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  lint-build-test:
    name: Lint, build, and test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

  cross-platform-build:
    name: Build sanity (${{ matrix.os }})
    # Build-only, not the full lint/test/race suite: this project
    # cross-compiles release binaries for linux/darwin/windows via
    # goreleaser, so a Windows- or macOS-specific compile break would
    # otherwise go unnoticed until release time. The race detector and
    # the rest of the test suite stay ubuntu-only (fastest, and the
    # most consistently supported platform for -race) so this matrix
    # job stays cheap and CI stays fast overall.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...
